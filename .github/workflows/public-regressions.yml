name: Public CPU regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test Rust frontend without a model or serving endpoint
        working-directory: ds41f-4xgx10-switchless/frontend
        run: cargo test --locked -j2
  engine-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure CPU-only helpers
        run: cmake -S ds41f-4xgx10-switchless/engine/tests -B build-host -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-host -j2
      - run: ctest --test-dir build-host --output-on-failure
      - name: Check public HTTP fixture without sending a request
        run: |
          python3 ds41f-4xgx10-switchless/tools/test_public_smoke.py
          python3 ds41f-4xgx10-switchless/tools/public_smoke.py
  vision-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy Pillow safetensors
      - name: Synthetic image preprocessing and cache contracts
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: python -m unittest discover -s ds41f-4xgx10-switchless/vision/tests -v
